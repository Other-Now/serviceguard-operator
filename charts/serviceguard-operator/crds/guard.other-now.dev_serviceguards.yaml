---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: serviceguards.guard.other-now.dev
spec:
  group: guard.other-now.dev
  names:
    kind: ServiceGuard
    listKind: ServiceGuardList
    plural: serviceguards
    shortNames:
    - sg
    singular: serviceguard
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Healthy")].status
      name: Healthy
      type: string
    - jsonPath: .status.consecutiveFailures
      name: Failures
      type: integer
    - jsonPath: .status.totalRemediations
      name: Remediations
      type: integer
    - jsonPath: .status.failedOver
      name: FailedOver
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ServiceGuardSpec says what to probe, which Deployment to heal, and how
              aggressively the operator is allowed to act.
            properties:
              deployment:
                description: Deployment (same namespace) that gets rollout-restarted
                  when the endpoint is unhealthy.
                type: string
              endpoint:
                description: URL probed with GET. 2xx/3xx within the timeout counts
                  as healthy.
                pattern: ^https?://
                type: string
              failureThreshold:
                default: 3
                description: Consecutive failed probes before any action. This is
                  the flap filter.
                format: int32
                minimum: 1
                type: integer
              intervalSeconds:
                default: 10
                format: int32
                minimum: 1
                type: integer
              minCertValidityHours:
                description: |-
                  For https endpoints: warn (event + condition + metric) when the served
                  certificate expires sooner than this. 0 disables. Never remediates.
                format: int32
                type: integer
              remediation:
                description: RemediationSpec bounds what the operator may do. Every
                  action is rate limited.
                properties:
                  cooldownSeconds:
                    default: 60
                    description: Minimum time between two actions on this guard, so
                      a rollout has time to finish.
                    format: int32
                    minimum: 0
                    type: integer
                  failover:
                    description: 'Optional last resort: repoint a Service at a standby
                      Deployment.'
                    properties:
                      selector:
                        additionalProperties:
                          type: string
                        type: object
                      service:
                        type: string
                    required:
                    - selector
                    - service
                    type: object
                  maxRestarts:
                    default: 3
                    description: |-
                      At most this many restarts inside WindowSeconds. After that the
                      operator fails over (if configured) or stops and reports.
                    format: int32
                    minimum: 0
                    type: integer
                  windowSeconds:
                    default: 600
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              timeoutSeconds:
                default: 2
                description: A probe slower than this counts as a failure.
                format: int32
                minimum: 1
                type: integer
            required:
            - deployment
            - endpoint
            type: object
          status:
            properties:
              certNotAfter:
                format: date-time
                type: string
              conditions:
                description: Healthy, Remediating/Degraded, CertExpiringSoon.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              consecutiveFailures:
                format: int32
                type: integer
              failedOver:
                type: boolean
              lastProbeLatencyMs:
                format: int64
                type: integer
              lastProbeTime:
                format: date-time
                type: string
              lastRemediationTime:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              recentRestarts:
                description: |-
                  Restart times still inside the window. Kept in status (not memory) so a
                  new leader after failover inherits the budget instead of resetting it.
                items:
                  format: date-time
                  type: string
                type: array
              totalRemediations:
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
